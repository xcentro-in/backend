version: "3.8"

services:
  # ----------------------------------------
  # DATABASE SERVICES
  # ----------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: xcentro-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-xcentro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-xcentro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: xcentro-redis
    restart: always
    command: ["sh", "/usr/local/etc/redis/redis-entrypoint.sh"]
    environment:
      REDIS_SUPERUSER: ${REDIS_SUPERUSER:-redis_super}
      REDIS_SUPERUSER_PASSWORD: ${REDIS_SUPERUSER_PASSWORD}
    volumes:
      - redis_data:/data
      - ./deployments/docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./deployments/docker/redis-entrypoint.sh:/usr/local/etc/redis/redis-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # MIGRATION SERVICE (runs after user setup)
  # ----------------------------------------
  setup-postgres-users:
    image: docker:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deployments/docker:/scripts
      - ./.env.users:/scripts/.env
    working_dir: /scripts
    command: sh ./setup-postgres-users.sh

  setup-redis-users:
    image: docker:latest
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deployments/docker:/scripts
      - ./.env.users:/scripts/.env
    working_dir: /scripts
    command: sh ./setup-redis-users.sh
  migrate:
    image: ghcr.io/darahasxcentro/xcentro-backend-migrate:latest
    env_file: .env
    depends_on:
      setup-postgres-users:
        condition: service_completed_successfully
      setup-redis-users:
        condition: service_completed_successfully

  # ----------------------------------------
  # APPLICATION SERVICES
  # ----------------------------------------
  api:
    image: ghcr.io/darahasxcentro/xcentro-backend-api:latest
    restart: always
    env_file: .env
    expose:
      - "80"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-worker:
    image: ghcr.io/darahasxcentro/xcentro-backend-notification-worker:latest
    restart: always
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/darahasxcentro/xcentro-frontend:latest
    restart: always
    env_file: .env
    depends_on:
      - api

  # ----------------------------------------
  # NGINX REVERSE PROXY WITH SSL
  # ----------------------------------------
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:
