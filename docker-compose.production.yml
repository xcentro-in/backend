services:
  # ----------------------------------------
  # DATABASE SERVICES
  # ----------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: xcentro-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-xcentro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-xcentro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: xcentro-redis
    restart: always
    command: ["sh", "/usr/local/etc/redis/redis-entrypoint.sh"]
    environment:
      REDIS_SUPERUSER: ${REDIS_SUPERUSER:-redis_super}
      REDIS_SUPERUSER_PASSWORD: ${REDIS_SUPERUSER_PASSWORD}
    volumes:
      - redis_data:/data
      - ./deployments/docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./deployments/docker/redis-entrypoint.sh:/usr/local/etc/redis/redis-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # MIGRATION SERVICE (runs after user setup)
  # ----------------------------------------
  # setup-postgres-users:
  #   image: docker:latest
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - ./deployments/docker:/scripts
  #     - ./.env.users:/scripts/.env
  #   working_dir: /scripts
  #   command: bash ./setup-postgres-users.sh

  # setup-redis-users:
  #   image: docker:latest
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - ./deployments/docker:/scripts
  #     - ./.env.users:/scripts/.env
  #   working_dir: /scripts
  #   command: bash ./setup-redis-users.sh
  migrate:
    image: ghcr.io/xcentro-in/backend-migrate:main-b495ce0
    env_file: .env
    # depends_on:
    #   setup-postgres-users:
    #     condition: service_completed_successfully
    #   setup-redis-users:
    #     condition: service_completed_successfully

  # ----------------------------------------
  # APPLICATION SERVICES
  # ----------------------------------------
  api:
    image: ghcr.io/xcentro-in/backend-api:main-b495ce0
    restart: always
    env_file: .env
    expose:
      - "80"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-worker:
    image: ghcr.io/xcentro-in/backend-notification-worker:main-b495ce0
    restart: always
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/xcentro-in/xcentro-app:mvp
    restart: always
    env_file: .env
    depends_on:
      - api

  # ----------------------------------------
  # SSL CERTIFICATE PREPARATION & NGINX
  # ----------------------------------------
  nginx:
    image: nginx:alpine
    container_name: xcentro-nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
        #      - /etc/letsencrypt/live/app.xcentro.in:/etc/letsencrypt/live/app.xcentro.in:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health", "||", "exit", "1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

volumes:
  postgres_data:
  redis_data:
