# HTTPS - Frontend Application
server {
    listen 443 ssl;
    server_name staging-app.xcentro.in;

    # Docker DNS resolver — re-resolves service names dynamically
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    ssl_certificate /etc/letsencrypt/live/staging-app.xcentro.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-app.xcentro.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    location / {
        set $upstream "frontend:80";
        proxy_pass http://$upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
