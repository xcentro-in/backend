# ACME challenge configuration for certbot
server {
    listen 80 default_server;
    server_name staging-app.xcentro.in staging-api.xcentro.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        access_log off;
        add_header Content-Type "text/plain";
    }

    location ~* ^/\\.well-known/acme-challenge/.*\\.(key|pem|crt|conf|sh|sql)$ {
        return 404;
    }

    location / {
        return 444;
    }
}
