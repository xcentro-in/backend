# HTTP - Only allow certificate renewal
server {
    listen 80;
    server_name api.xcentro.in;

    # Allow certbot for SSL certificate validation only
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;

        # Security: Only allow text files (ACME challenges are plain text)
        # Block any attempt to access other file types
        location ~ \.(key|pem|crt|conf|sh|sql)$ {
            deny all;
            return 404;
        }
    }

    # Deny all other HTTP requests
    location / {
        return 444;
    }
}

# HTTPS - Backend API
server {
    listen 443 ssl;
    server_name api.xcentro.in;

    # SSL certificates (will be generated by certbot)
    ssl_certificate /etc/letsencrypt/live/api.xcentro.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xcentro.in/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers (HSTS only - other headers set by Echo middleware)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy to backend API container
    location / {
        proxy_pass http://api:80;
        proxy_http_version 1.1;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://api:80/health;
        access_log off;
    }
}
