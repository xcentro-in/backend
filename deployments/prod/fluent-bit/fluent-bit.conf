[SERVICE]
    Flush       1
    Daemon      Off
    Log_Level   info
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port   2020

[INPUT]
    Name        forward
    Listen      0.0.0.0
    Port        24224

[OUTPUT]
    Name        file
    Match       xcentro.postgres
    Path        /output_logs
    File        xcentro.postgres.log
    Format      template
    Template    {log}

[OUTPUT]
    Name        file
    Match       xcentro.redis
    Path        /output_logs
    File        xcentro.redis.log
    Format      template
    Template    {log}

[OUTPUT]
    Name        file
    Match       xcentro.migrate
    Path        /output_logs
    File        xcentro.migrate.log
    Format      template
    Template    {log}

[OUTPUT]
    Name        file
    Match       xcentro.api
    Path        /output_logs
    File        xcentro.api.log
    Format      template
    Template    {log}

[OUTPUT]
    Name        file
    Match       xcentro.notification-worker
    Path        /output_logs
    File        xcentro.notification-worker.log
    Format      template
    Template    {log}

[OUTPUT]
    Name        file
    Match       xcentro.frontend
    Path        /output_logs
    File        xcentro.frontend.log
    Format      template
    Template    {log}

[OUTPUT]
    Name        file
    Match       xcentro.certbot
    Path        /output_logs
    File        xcentro.certbot.log
    Format      template
    Template    {log}

[OUTPUT]
    Name        file
    Match       xcentro.nginx
    Path        /output_logs
    File        xcentro.nginx.log
    Format      template
    Template    {log}