services:
  # ----------------------------------------
  # DATABASE SERVICES
  # ----------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: xcentro-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-xcentro}
      POSTGRES_INITDB_ARGS: >-
        -c xcentro.db_owner_user=${DB_OWNER_USER:-owner}
        -c xcentro.db_owner_password=${DB_OWNER_PASSWORD}
        -c xcentro.db_rw_user=${DB_RW_USER:-xcentro_rw}
        -c xcentro.db_rw_password=${DB_RW_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/01-init-users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-xcentro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: xcentro-redis
    restart: always
    command: ["sh", "/usr/local/etc/redis/redis-entrypoint.sh"]
    environment:
      REDIS_SUPERUSER: ${REDIS_SUPERUSER:-redis_super}
      REDIS_SUPERUSER_PASSWORD: ${REDIS_SUPERUSER_PASSWORD}
      REDIS_APP_USER: ${REDIS_APP_USER:-xcentro_app}
      REDIS_APP_PASSWORD: ${REDIS_APP_PASSWORD}
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis-entrypoint.sh:/usr/local/etc/redis/redis-entrypoint.sh:ro
      - ./init-redis.sh:/usr/local/etc/redis/init-redis.sh:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # MIGRATION SERVICE
  # ----------------------------------------
  migrate:
    image: ghcr.io/xcentro-in/backend-migrate:main-ea1757a
    container_name: xcentro-migrate
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------
  # APPLICATION SERVICES
  # ----------------------------------------
  api:
    image: ghcr.io/xcentro-in/backend-api:main-ea1757a
    container_name: xcentro-api
    restart: always
    env_file: .env
    expose:
      - "80"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-worker:
    image: ghcr.io/xcentro-in/backend-notification-worker:main-ea1757a
    container_name: xcentro-notification-worker
    restart: always
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/xcentro-in/xcentro-app:mvp-53fac8c
    container_name: xcentro-frontend
    restart: always
    env_file: .env
    expose:
      - "80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------
  # SSL CERTIFICATE MANAGEMENT & NGINX
  # ----------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: xcentro-certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"

  nginx:
    image: nginx:alpine
    container_name: xcentro-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

volumes:
  postgres_data:
  redis_data:
  certbot_conf:
  certbot_www:
