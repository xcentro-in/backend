# XCentro Redis configuration enabling both RDB snapshots and AOF for hybrid persistence
# Minimal tuned configuration; adjust as needed.

##################################
# GENERAL
##################################
port 6379
protected-mode yes
bind 0.0.0.0 ::

# Keep default user enabled for bootstrap. The setup script will disable it
# AFTER creating super and application users. Disabling it here caused
# initial AUTH failures during ACL user creation.
# (The script still calls: ACL SETUSER default off)

##################################
# ACL PERSISTENCE
##################################
# Persist ACL users/permissions across restarts. Without this, users would
# be lost because Redis would not write them to disk (they do NOT live only
# in RDB/AOF by default unless an aclfile is specified).
aclfile /data/users.acl

##################################
# SNAPSHOTTING (RDB)
##################################
# Save after 900 sec if at least 1 key changed
# Save after 300 sec if at least 10 keys changed
# Save after 60 sec if at least 10000 keys changed
save 900 1
save 300 10
save 60 10000

# DB filename
dbfilename dump.rdb
dir /data
rdbcompression yes
rdbchecksum yes

##################################
# AOF (Append Only File)
##################################
appendonly yes
# Use "everysec" for balance between durability and performance
appendfsync everysec
# Let Redis rewrite the AOF automatically
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Use the new (Redis 7+) AOF rewrite without blocking large writes excessively
no-appendfsync-on-rewrite no

# Optionally, we can use RDB preamble so that the AOF starts with an RDB payload
# This allows faster restarts and then incremental AOF ops after the snapshot
# (Redis 7+ behavior: enabled by default when both RDB and AOF are active)
aof-use-rdb-preamble yes

##################################
# AOF & RDB HYBRID
##################################
# Hybrid persistence: Standard Redis behavior when both snapshotting (save) and AOF are enabled.
# The AOF file will start with an RDB preamble followed by incremental commands.

##################################
# KEYSPACE NOTIFICATIONS (optional)
##################################
# notify-keyspace-events ""

##################################
# SECURITY (ACL handled externally)
##################################
# ACL users will be created by setup-redis-users.sh script
# requirepass is passed via command line argument to override runtime secret

##################################
# APP TUNING
##################################
maxmemory-policy noeviction

# Logging
loglevel notice
logfile ""

# Slowlog
slowlog-log-slower-than 10000
slowlog-max-len 128

##################################
# APPEND ONLY FILE FSYNC POLICY NOTES
##################################
# always     => Highest durability, slowest.
# everysec   => Balanced (recommended for most apps).
# no         => Fastest, risk of losing several seconds of data.

##################################
# END OF FILE
