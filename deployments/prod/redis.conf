# XCentro Redis Configuration - CACHE MODE
# Optimized for high-throughput caching with LRU eviction.

##################################
# NETWORK & GENERAL
##################################
port 6379
bind 0.0.0.0 ::
protected-mode yes

# TCP Keepalive is critical for Go/Node applications to detect dead connections
# prevents connection pool hangs.
tcp-keepalive 300
timeout 0

##################################
# MEMORY MANAGEMENT (CRITICAL)
##################################
# 1. Set a hard memory limit.
# IMPORTANT: Change '512mb' to 70-80% of your container's RAM limit.
maxmemory 512mb

# 2. Eviction Policy
# 'allkeys-lru': Deletes the least recently used keys when maxmemory is reached.
# This allows the cache to self-manage and never reject writes.
maxmemory-policy allkeys-lru

# 3. Tuning
# Increases accuracy of the LRU algorithm (default is 5, 10 is more accurate but uses more CPU)
maxmemory-samples 5

##################################
# PERSISTENCE (Warm Restart Only)
##################################
# Since this is a cache, we disable AOF to save I/O.
appendonly no

# We keep RDB snapshots so that if the container restarts, 
# it comes back up with data (Warm Cache) rather than empty.
# Save every 5 mins if 10 keys changed, or 60s if 10,000 changed.
save 300 10
save 60 10000

# If the background save fails (disk full?), DO NOT stop the app. 
# It's just a cache; uptime is more important than persistence.
stop-writes-on-bgsave-error no

dbfilename dump.rdb
dir /data
rdbcompression yes
rdbchecksum yes

##################################
# SECURITY (ACL)
##################################
# Persist ACL users/permissions across restarts.
aclfile /data/users.acl

##################################
# DEBUGGING & LOGGING
##################################
loglevel notice
logfile ""

# Catch slow commands (helpful to see if a specific query is locking the cache)
slowlog-log-slower-than 10000
slowlog-max-len 1000