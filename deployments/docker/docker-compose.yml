services:
  postgres:
    image: ghcr.io/xcentro-in/infra/postgres:main-cfdeee5
    container_name: xcentro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-SuperSecure123!}
      POSTGRES_DB: ${POSTGRES_DB:-xcentro}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Standard Postgres data path
      - postgres_data:/var/lib/postgresql/
      # Configs
      - ./custom.conf:/etc/postgresql/custom.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/custom.conf"]

  redis:
    image: redis:8-bookworm
    container_name: xcentro-redis
    restart: unless-stopped
    command: ["sh", "/usr/local/etc/redis/redis-entrypoint.sh"]
    environment:
      REDIS_SUPERUSER: ${REDIS_SUPERUSER:-redis_super}
      REDIS_SUPERUSER_PASSWORD: ${REDIS_SUPERUSER_PASSWORD:-RedisSuper123!}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis-entrypoint.sh:/usr/local/etc/redis/redis-entrypoint.sh:ro

volumes:
  postgres_data:
  redis_data:
