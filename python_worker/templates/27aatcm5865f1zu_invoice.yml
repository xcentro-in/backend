issuer: Xcentro
keywords:
  - INVOICE
  - GSTIN
date_format: "%d/%m/%Y"

fields:
  invoice_number: "Invoice#\\s*(?P<invoice_number>INV-\\d+)"
  date: "Invoice Date\\s*:\\s*(?P<date>\\d{2}/\\d{2}/\\d{4})"
  po_number: "P\\.O\\.\\#\\s*:\\s*(?P<po_number>[A-Z0-9-]+)"
  vendor_gstin: "(?P<vendor_gstin>[0-9A-Z]{15})\\s+shubhankar@xcentro\\.in"
  buyer_gstin: "Bill To\\s+Rob & Joe Traders.*?GSTIN\\s*(?P<buyer_gstin>[0-9A-Z]{15})"
  amount: "Total\\s*(?P<amount>\\d+\\.\\d{2})"
  cgst: "CGST \\(\\d+\\.\\d+%\\)\\s*(?P<cgst>\\d+\\.\\d{2})"
  sgst: "SGST \\(\\d+\\.\\d+%\\)\\s*(?P<sgst>\\d+\\.\\d{2})"