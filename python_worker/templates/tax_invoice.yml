issuer: Samuruddhi Distribution
keywords:
  - Tax\s+Invoice

fields:
  # Captures the name from the line immediately following "Tax Invoice"
  business_name:
    parser: regex
    regex: Tax\s+Invoice\s*\n\s*([A-Z\s]+LTD)
    group: first

  # Captures the GSTIN specifically from the sender section (Page 1)
  business_gstin:
    parser: regex
    regex: GSTIN/UIN:\s+([0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[A-Z1-9]{1}[Z2]{1}[A-Z0-9]{1})
    group: first

  invoice_number:
    parser: regex
    regex: (SMD[I/]\d+/\d+-\d+)
    group: first

  date:
    parser: regex
    regex: (\d{1,2}-.{3}-\d{2})
    group: first
  
  amount:
    parser: regex
    regex: Total\s+([\d,]+\.\d{2})
    type: float
    group: last

  lines:
    parser: lines
    start: Description\s+of\s+Goods
    # End shortened to handle OCR variations
    end: continued\s+to
    line: (?P<description>.+?)\s+(?P<hsn>\d{4})\s+(?P<qty>\d+\s*NOS)\s+(?P<rate>[\d,.]+)\s*NOS\s+(?P<amount>[\d,.]+)

  # FIXED: Markers now match the OCR "glitches" in your log
  tax_lines:
    parser: lines
    # Using HSNNSAC because your OCR read the slash as an N
    start: HSNNSAC
    # Using a unique phrase to stop the parser correctly
    end: Tax\s+Amount\s+\(in\s+words\)
    line: (?P<hsn_sac>\d{4})\s+(?P<taxable_value>[\d,.]+)\s+(?P<igst_rate>[\d.]+)%\s+(?P<igst_amount>[\d,.]+)\s+(?P<total_tax_amount>[\d,.]+)

options:
  currency: INR
  date_formats:
    - '%d-%b-%y'
  replace:
    - ['-0ct-', '-Oct-'] # Fixes the OCR 'zero' instead of 'O'
  required_fields: []
