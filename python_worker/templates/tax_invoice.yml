issuer: Samuruddhi Distribution Tax Invoice
keywords:
  - Tax Invoice

fields:
  vendor_name:
    parser: regex
    regex: '(?si)Tax\s+Invoice\s*\n\s*(?P<vendor_name>[A-Z\s]+(?:LTD|PVT|CORP|INC|CO)[A-Z\s]*)'
    group: first

  vendor_gstin:
    parser: regex
    regex: '(?si)GSTIN/UIN:\s+(?P<vendor_gstin>[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[A-Z1-9]{1}[Z2]{1}[A-Z0-9]{1})'
    group: first

  invoice_number:
    parser: regex
    regex: '(?si)(?P<invoice_number>[A-Z]{2,4}[I/]\d+/\d+-\d+)'
    group: first

  date:
    parser: regex
    regex: '(?si)(?P<date>\d{1,2}-.{3}-\d{2})'
    group: first

  amount:
    parser: regex
    regex: '(?si)Total\s+(?P<amount>[\d,]+\.\d{2})'
    type: float
    group: last

lines:
  start: '(?si)Description\s+of\s+Goods'
  end: '(?si)continued\s+to'
  line: '(?si)(?P<description>.+?)\s+(?P<sku>\d{4})\s+(?P<quantity>\d+\s*NOS)\s+(?P<unit_price>[\d,.]+)\s*NOS\s+(?P<amount>[\d,.]+)'

options:
  currency: INR
  date_formats:
    - '%d-%b-%y'
  replace:
    - ['-0ct-', '-Oct-']
  required_fields: []
