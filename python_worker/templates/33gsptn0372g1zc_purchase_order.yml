issuer: Rob & Joe Traders
keywords:
  - "PURCHASE ORDER"
  - "Rob & Joe Traders"
  - "GSTIN 33GSPTN0372G1ZC"
  - "Chennai"

fields:
  po_number:
    - 'Purchase\s*Order#\s*(?P<po_number>PO-\d+)'
  date:
    - 'Date\s*(?P<date>\d{2}/\d{2}/\d{4})'
  payment_terms:
    - 'Terms\s*(?P<payment_terms>Due on Receipt)'
  vendor_gstin:
    - 'India\s*GSTIN\s*(?P<vendor_gstin>\d{2}[A-Z]{5}\d{4}[A-Z]{1}[A-Z\d]{1}Z[A-Z\d]{1})'
  buyer_gstin:
    - 'Mumbai\s*Maharashtra\s*400093\s*\n\s*GSTIN\s*(?P<buyer_gstin>\d{2}[A-Z]{5}\d{4}[A-Z]{1}[A-Z\d]{1}Z[A-Z\d]{1})'
  subtotal:
    - 'Sub\s*Total\s*(?P<subtotal>[\d,]+\.\d{2})'
  cgst:
    - 'CGST\s*\(\d{2}\.\d{2}%\)\s*(?P<cgst>[\d,]+\.\d{2})'
  sgst:
    - 'SGST\s*\(\d{2}\.\d{2}%\)\s*(?P<sgst>[\d,]+\.\d{2})'
  amount:
    - 'Total\s*(?P<amount>[\d,]+\.\d{2})'

options:
  currency: INR
  decimal_separator: "."
  thousands_separator: ""
  date_formats:
    - "%d/%m/%Y"
    - "%d-%m-%Y"
    - "%Y-%m-%d"