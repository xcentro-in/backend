issuer: SuperStore
keywords:
  - "SuperStore"
  - "Bill To:"
  - "Ship To:"

fields:
  # Using the short 'field: regex' format to avoid parser errors
  invoice_number: '(?i)invoice\s*(?:no\.?|#)\s*(\d+)'
  order_id: 'Order ID:\s*([A-Z0-9-]+)'
  date: 'Date:\s*([A-Z][a-z]{2}\s\d{2}\s\d{4})'
  customer: 'Bill To:\s*([\w\s]+?)\s*Ship To:'
  amount: 'Total:\s*\$\s*([\d.]+)'
  shipping_cost: 'Shipping:\s*\$\s*([\d.]+)'
  discount: 'Discount\s*\(\d+%\):\s*\$\s*([\d.]+)'

lines:
  start: 'Item'
  end: 'Notes:'
  # Simplified line regex to be less sensitive to quotes
  line: '(?P<name>.+?)\s+"?(?P<qty>\d+)"?\s+.*?\$(?P<price>[\d.]+)\s+\$(?P<amount>[\d.]+)'

options:
  currency: USD
  decimal_separator: .
  date_formats:
    - '%b %d %Y'