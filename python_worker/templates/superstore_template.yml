issuer: SuperStore Invoice
keywords:
  - "SuperStore"
  - "INVOICE"
  - "Bill To:"
  - "Ship To:"

fields:
  invoice_number:
    - '(?si)invoice\s*#\s*(?P<invoice_number>\d+)'
  date:
    - '(?si)\b(?P<date>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{4})\b'
  po_number:
    - '(?si)Order\s*ID\s*:\s*(?P<po_number>[A-Z0-9-]+)'
  vendor_name:
    - '(?si)(?P<vendor_name>SuperStore)'
  amount:
    - '(?si)Total:\s*\$?\s*(?P<amount>[\d,]+\.\d{2})'
  subtotal:
    - '(?si)Subtotal:\s*\$?\s*(?P<subtotal>[\d,]+\.\d{2})'
  shipping:
    - '(?si)Shipping:\s*\$?\s*(?P<shipping>[\d,]+\.\d{2})'
  discount:
    - '(?si)Discount\s*\((?P<discount>\d+)%\):'

lines:
  start: '(?si)Item\s+Quantity\s+Rate\s+Amount'
  end: '(?si)Subtotal:'
  line: '(?si)(?P<description>[\w\s,\-]+?)\s+(?P<quantity>\d+)\s+\$?(?P<unit_price>[\d,]+\.\d{2})\s+\$?(?P<amount>[\d,]+\.\d{2})'
  types:
    quantity: int
    unit_price: float
    amount: float
  multiline: true

options:
  currency: USD
  decimal_separator: .
  remove_thousands_separator: true
  date_formats:
    - '%b %d %Y'
