name: Send Adaptive Card on main branch

on:
  push:
    branches:
      - main

jobs:
  send-adaptive-card:
    runs-on: ubuntu-latest
    steps:
      - name: Send Adaptive Card with Commit Details
        env:
          POWERAUTOMATE_URL: ${{ secrets.POWERAUTOMATE_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          COMMITTER_NAME: ${{ github.event.head_commit.committer.name }}
          REPO_NAME: ${{ github.repository }}
        run: |
          # Escape special JSON characters in the commit message to prevent breaking the payload.
          # This handles backslashes, double quotes, and newlines.
          COMMIT_MESSAGE_ESCAPED=$(echo "$COMMIT_MESSAGE" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g' | sed -z 's/\n/\\n/g')

          # Construct the JSON payload for the Adaptive Card using printf for safe variable injection.
          JSON_PAYLOAD=$(printf '{
            "type": "message",
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "New Commit to `main`",
                      "weight": "Bolder",
                      "size": "Large"
                    },
                    {
                      "type": "TextBlock",
                      "text": "Repository: %s",
                      "isSubtle": true,
                      "spacing": "None"
                    },
                    {
                      "type": "FactSet",
                      "facts": [
                        {
                          "title": "Committer:",
                          "value": "%s"
                        },
                        {
                          "title": "Message:",
                          "value": "%s"
                        },
                        {
                          "title": "Timestamp:",
                          "value": "{{DATE(%s, SHORT)}} at {{TIME(%s)}}"
                        }
                      ]
                    }
                  ],
                  "actions": [
                    {
                      "type": "Action.OpenUrl",
                      "title": "View Commit",
                      "url": "%s"
                    }
                  ]
                }
              }
            ]
          }' "$REPO_NAME" "$COMMITTER_NAME" "$COMMIT_MESSAGE_ESCAPED" "$COMMIT_TIMESTAMP" "$COMMIT_TIMESTAMP" "$COMMIT_URL")

          # Send the POST request with the JSON payload to the Power Automate webhook.
          curl --request POST \
               --header "Content-Type: application/json" \
               --data "$JSON_PAYLOAD" \
               "$POWERAUTOMATE_URL"
